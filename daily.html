  <body class="page-white">
    <nav class="top-pills top-pills-light" aria-label="Primary">
      <a class="pill" href="daily.html" aria-current="page">Daily Report</a>
      <a class="pill" href="library.html">Library</a>
      <a class="pill" href="#" id="pdf-link">PDF</a>
      <a class="pill" href="#" id="guide-btn">Guide</a>
    </nav>
    <div id="auth-root" class="auth-root-light" data-theme="light"></div>

    <main class="white-main daily-wide">
      <div class="daily-header-row">
        <div>
          <h1>Daily Report</h1>
          <p id="daily-greeting" class="daily-greeting">Here is your daily report.</p>
          <p id="daily-meta" class="lede"></p>
        </div>
        <button type="button" class="ghost-btn" id="customize-btn" aria-expanded="false" aria-controls="prefs-panel">
          ⚙ Customize
        </button>
      </div>
      <div id="daily-columns" class="daily-columns"></div>
    </main>

    <!-- Preferences popup — outside <main> so auth-gated blur cannot trap it -->
    <div class="prefs-overlay" id="prefs-overlay" hidden>
      <div class="prefs-popup" id="prefs-panel" role="dialog" aria-modal="true" aria-labelledby="prefs-heading">
        <div class="prefs-popup-head">
          <h2 id="prefs-heading">Customize Report</h2>
          <button type="button" class="notion-close-btn" id="prefs-close-btn" aria-label="Close">✕</button>
        </div>
        <p class="prefs-hint">Toggle the sections you want to see in your daily report.</p>
        <div id="prefs-toggles" class="prefs-toggles"></div>
        <div class="prefs-footer">
          <button type="button" class="add-resource-btn" id="prefs-save-btn">Done</button>
        </div>
      </div>
    </div>

    <a class="brand-mark brand-mark-dark" href="index.html">Research<br />Hub</a>
    <div id="music-player-root"></div>
    <script type="module" src="js/daily.js"></script>
    <script type="module" src="js/player.js"></script>
    <script type="module" src="js/auth.js"></script>
  </body>
