<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var p = location.pathname || "/";
        var under =
          p === "/researchhub" ||
          p === "/researchhub/" ||
          p.indexOf("/researchhub/") === 0;
        if (!under) return;
        if (!document.querySelector("base")) {
          var b = document.createElement("base");
          b.href = "/researchhub/";
          document.head.insertBefore(b, document.head.firstChild);
        }
        window.__APP_BASE__ = "/researchhub";
      })();
    </script>
    <script src="js/base.js?v=20260806b"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dammi di più</title>
    <meta name="description" content="Gestisci le tue fonti di opportunità personali in Research Hub." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Research Hub" />
    <meta property="og:title" content="Libreria — Research Hub" />
    <meta property="og:description" content="Gestisci le tue fonti di opportunità personali in Research Hub." />
    <meta property="og:url" content="https://www.teramap.co/researchhub/library" />
    <meta property="og:image" content="https://www.teramap.co/researchhub/images/OG-meta-researchhub.png" />
    <meta property="og:image:secure_url" content="https://www.teramap.co/researchhub/images/OG-meta-researchhub.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Research Hub" />
    <meta name="twitter:image" content="https://www.teramap.co/researchhub/images/OG-meta-researchhub.png" />
    <link rel="image_src" href="https://www.teramap.co/researchhub/images/OG-meta-researchhub.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Libreria — Research Hub" />
    <meta name="twitter:description" content="Gestisci le tue fonti di opportunità personali in Research Hub." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260806b" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
  </head>
  <body class="page-white">
    <nav class="top-pills top-pills-light" aria-label="Primary">
      <a class="pill" href="daily.html" data-i18n="nav.daily">Report Giornaliero</a>
      <a class="pill" href="library.html" aria-current="page" data-i18n="nav.library">Libreria</a>
      <button type="button" class="pill" id="xls-export-btn" data-i18n="results.export">Esporta XLS</button>
      <a class="pill" href="#" id="guide-btn" data-i18n="nav.guide">Guida</a>
    </nav>
    <div class="top-right-bar top-right-bar-light">
      <button type="button" class="lang-toggle-btn pill pill-lang pill-lang-light" id="lang-toggle-btn" aria-label="Cambia lingua">EN</button>
    </div>
    <div id="auth-root" class="auth-root-light" data-theme="light"></div>

    <main class="white-main library-main">
      <div class="library-head">
        <div>
          <h1 data-i18n="lib.title">Libreria</h1>
          <p class="lede" data-i18n="lib.lede">Aggiungi un link, poi clicca sincronizza per aggiornare il tuo feed.</p>
        </div>
        <div class="library-actions">
          <button type="button" class="ghost-btn" id="sync-all-btn" data-i18n="lib.syncAll">Sincronizza tutto</button>
          <button type="button" class="ghost-btn" id="share-library-btn" data-i18n="lib.share">Condividi</button>
          <button type="button" class="ghost-btn" id="notion-toggle-btn" data-i18n="notion.connect">Notion</button>
        </div>
      </div>

      <p id="sync-status" class="notion-status" aria-live="polite"></p>

      <!-- Single URL form -->
      <form class="add-resource-form" id="add-resource-form">
        <label>
          <span data-i18n="lib.urlLabel">Link al sito web</span>
          <input name="url" type="url" required data-i18n-ph="lib.urlPlaceholder" placeholder="https://esempio.com" />
        </label>
        <div class="form-actions form-actions--library">
          <button type="submit" class="add-resource-btn" id="save-resource-btn" data-i18n="lib.saveBtn">
            Salva e indicizza
          </button>
          <button type="button" class="ghost-btn bulk-import-toggle" id="bulk-import-toggle" data-i18n="lib.bulkImport">
            Importa in blocco
          </button>
          <button type="button" class="cancel-btn" id="cancel-add-btn" hidden data-i18n="lib.cancel">Annulla</button>
        </div>
      </form>

      <div class="bulk-import-panel" id="bulk-import-panel" hidden>
        <textarea
          id="bulk-urls"
          class="bulk-textarea"
          rows="6"
          data-i18n-ph="lib.bulkPlaceholder"
          placeholder="Un link per riga…"
        ></textarea>
        <div class="form-actions">
          <button type="button" class="add-resource-btn" id="bulk-add-btn" data-i18n="lib.bulkAdd">Aggiungi tutti</button>
        </div>
      </div>

      <div id="library-list" class="simple-list"></div>
    </main>

    <!-- Share library popup -->
    <div class="notion-overlay" id="share-overlay" hidden>
      <div class="notion-popup" role="dialog" aria-labelledby="share-heading" aria-modal="true">
        <div class="notion-popup-head">
          <h2 id="share-heading" data-i18n="lib.shareTitle">Libreria condivisa</h2>
          <button type="button" class="notion-close-btn" id="share-close-btn" aria-label="Chiudi">✕</button>
        </div>
        <p class="notion-status" id="share-status"></p>
        <input type="text" id="share-url-input" class="share-url-input" readonly />
        <div class="form-actions" style="margin-top:1rem">
          <button type="button" class="add-resource-btn" id="share-copy-btn">Copia link</button>
        </div>
      </div>
    </div>

    <!-- Import library popup -->
    <div class="notion-overlay" id="import-overlay" hidden>
      <div class="notion-popup" role="dialog" aria-labelledby="import-heading" aria-modal="true">
        <div class="notion-popup-head">
          <h2 id="import-heading" data-i18n="lib.importTitle">Importa Libreria</h2>
          <button type="button" class="notion-close-btn" id="import-close-btn" aria-label="Chiudi">✕</button>
        </div>
        <p class="notion-status" id="import-status"></p>
        <div class="form-actions" style="margin-top:1rem">
          <button type="button" class="add-resource-btn" id="import-confirm-btn" data-i18n="lib.importBtn">Importa</button>
        </div>
      </div>
    </div>

    <!-- Notion popup -->
    <div class="notion-overlay" id="notion-overlay" hidden>
      <div class="notion-popup" role="dialog" aria-labelledby="notion-heading" aria-modal="true">
        <div class="notion-popup-head">
          <h2 id="notion-heading" data-i18n="notion.heading">Connetti Notion</h2>
          <button type="button" class="notion-close-btn" id="notion-close-btn" aria-label="Chiudi">✕</button>
        </div>
        <p id="notion-status" class="notion-status" aria-live="polite"></p>
        <form id="notion-form">
          <p class="form-note" data-i18n="notion.connectOnce">
            Connetti una volta. Dopo questo, ogni Salva su Notion è un clic.
          </p>
          <label>
            <span data-i18n="notion.secret">Segreto di integrazione</span>
            <input name="token" type="password" required autocomplete="off" placeholder="ntn_… or secret_…" />
          </label>
          <label>
            <span data-i18n="notion.dbId">ID Database</span>
            <input name="databaseId" type="text" required autocomplete="off" value="c4e56b17d92d40b59aeb00878c6066eb" placeholder="32-character ID from the Notion URL" />
          </label>
          <div class="form-actions">
            <button type="submit" class="add-resource-btn" id="notion-save-btn" data-i18n="notion.saveTest">Salva e testa connessione</button>
            <button type="button" class="cancel-btn" id="notion-disconnect-btn" data-i18n="notion.disconnect">Disconnetti</button>
          </div>
        </form>
      </div>
    </div>

    <a class="brand-mark brand-mark-dark" href="index.html">Research<br />Hub</a>
    <div id="music-player-root"></div>
    <script type="module" src="js/library.js?v=20260806b"></script>
    <script type="module" src="js/player.js?v=20260806b"></script>
    <script type="module" src="js/auth.js?v=20260806b"></script>
  </body>
</html>
