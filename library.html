<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library — Research Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
  </head>
  <body class="page-white">
    <nav class="top-pills top-pills-light" aria-label="Primary">
      <a class="pill" href="daily.html">Daily Report</a>
      <a class="pill" href="library.html" aria-current="page">Library</a>
      <a class="pill" href="#" id="pdf-link">PDF</a>
    </nav>

    <main class="white-main library-main">
      <div class="library-head">
        <div>
          <h1>Library</h1>
          <p class="lede">All source sites in one place.</p>
        </div>
        <button type="button" class="add-resource-btn" id="add-resource-btn">
          Add resource
        </button>
      </div>

      <section class="notion-panel" aria-labelledby="notion-heading">
        <h2 id="notion-heading">Notion</h2>
        <p id="notion-status" class="notion-status" aria-live="polite"></p>
        <form class="add-resource-form" id="notion-form">
          <p class="form-note">
            Connect once. After this, every Save to Notion is one click.
          </p>
          <label>
            Integration secret
            <input
              name="token"
              type="password"
              required
              autocomplete="off"
              placeholder="ntn_… or secret_…"
            />
          </label>
          <label>
            Database ID
            <input
              name="databaseId"
              type="text"
              required
              autocomplete="off"
              value="c4e56b17d92d40b59aeb00878c6066eb"
              placeholder="32-character ID from the Notion URL"
            />
          </label>
          <div class="form-actions">
            <button type="submit" class="add-resource-btn" id="notion-save-btn">
              Save &amp; test connection
            </button>
            <button type="button" class="cancel-btn" id="notion-disconnect-btn">Disconnect</button>
          </div>
        </form>
      </section>

      <form class="add-resource-form" id="add-resource-form" hidden>
        <label>
          Website link
          <input name="url" type="url" required placeholder="https://example.com" />
        </label>
        <div class="form-actions">
          <button type="submit" class="add-resource-btn">Save resource</button>
          <button type="button" class="cancel-btn" id="cancel-add-btn">Cancel</button>
        </div>
        <p class="form-note">Only the link is required. Saved resources stay in this browser.</p>
      </form>

      <div id="library-list" class="simple-list"></div>
    </main>

    <a class="brand-mark brand-mark-dark" href="index.html">Research<br />Hub</a>
    <div id="music-player-root"></div>
    <script type="module" src="js/library.js"></script>
    <script type="module" src="js/player.js"></script>
  </body>
</html>
