<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Results — Research Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page-white">
    <header class="white-header">
      <a class="wordmark" href="/">Research Hub</a>
      <nav class="white-nav">
        <a href="/daily.html">Daily Report</a>
        <a href="/library.html">Library</a>
        <a href="#" id="pdf-link">PDF</a>
      </nav>
    </header>

    <main class="white-main">
      <form class="results-search" action="/results.html" method="get" role="search">
        <label class="sr-only" for="query">Search</label>
        <input id="query" name="q" type="search" placeholder="search here" autocomplete="off" />
      </form>

      <p id="results-meta" class="lede"></p>
      <div id="results-list" class="simple-list"></div>
      <div id="source-searches" class="source-searches"></div>
    </main>

    <div id="music-player-root"></div>
    <script type="module" src="/js/results.js"></script>
    <script type="module" src="/js/player.js"></script>
  </body>
</html>
