name: Scrape opportunities

on:
  # Immediate: any library add/remove that updates this file
  push:
    paths:
      - "data/custom-sources.json"
  # Backup refresh for built-in + custom sources
  schedule:
    - cron: "0 */6 * * *"
  # Manual / Sync all / re-scrape one source
  workflow_dispatch:
    inputs:
      url:
        description: "Optional new source URL to add before scraping"
        required: false
        type: string
        default: ""
      source_id:
        description: "Optional source id to scrape only"
        required: false
        type: string
        default: ""
      remove_source_id:
        description: "Optional custom source id to remove"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: scrape-opportunities
  cancel-in-progress: false

jobs:
  scrape:
    # Avoid loop: bot commits from scrape must not re-trigger this workflow.
    if: >
      github.event_name != 'push' ||
      (github.event.head_commit != null &&
       !startsWith(github.event.head_commit.message, 'chore: refresh scraped'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply library changes
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.url != '' || inputs.remove_source_id != '') }}
        run: |
          python scripts/manage_sources.py \
            --url "${{ inputs.url }}" \
            --remove "${{ inputs.remove_source_id }}"

      - name: Scrape sources
        run: |
          EVENT="${{ github.event_name }}"
          SOURCE_ID="${{ inputs.source_id }}"
          REMOVE_ID="${{ inputs.remove_source_id }}"

          if [ "$EVENT" = "push" ]; then
            echo "Library file changed — scraping all sources now."
            python scripts/scrape_opportunities.py
          elif [ -n "$SOURCE_ID" ]; then
            echo "Scraping one source: $SOURCE_ID"
            python scripts/scrape_opportunities.py "$SOURCE_ID"
          elif [ -n "$REMOVE_ID" ]; then
            echo "Source removed; cleaning without full scrape."
          else
            echo "Full scrape."
            python scripts/scrape_opportunities.py
          fi

      - name: Commit updated data
        run: |
          set -euo pipefail
          git config user.name "elabaglama"
          git config user.email "elaba@users.noreply.github.com"

          mkdir -p /tmp/scrape-out
          cp data/opportunities.json /tmp/scrape-out/opportunities.json
          cp data/scrape-meta.json /tmp/scrape-out/scrape-meta.json
          cp data/custom-sources.json /tmp/scrape-out/custom-sources.json

          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git checkout -B scrape-publish origin/main

            cp /tmp/scrape-out/opportunities.json data/opportunities.json
            cp /tmp/scrape-out/scrape-meta.json data/scrape-meta.json
            cp /tmp/scrape-out/custom-sources.json data/custom-sources.json

            git add data/opportunities.json data/scrape-meta.json data/custom-sources.json
            if git diff --staged --quiet; then
              echo "No opportunity changes vs main."
              exit 0
            fi
            git commit -m "chore: refresh scraped opportunities"

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push race, retry $i..."
            sleep $((i * 2))
          done
          echo "Failed to push after retries."
          exit 1
