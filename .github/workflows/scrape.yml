name: Scrape opportunities

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Optional new source URL to add before scraping"
        required: false
        type: string
        default: ""
      source_id:
        description: "Optional source id to scrape only"
        required: false
        type: string
        default: ""
      remove_source_id:
        description: "Optional custom source id to remove"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: scrape-opportunities
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply library changes
        if: ${{ inputs.url != '' || inputs.remove_source_id != '' }}
        run: |
          python scripts/manage_sources.py \
            --url "${{ inputs.url }}" \
            --remove "${{ inputs.remove_source_id }}"

      - name: Scrape sources
        run: |
          if [ -n "${{ inputs.source_id }}" ]; then
            python scripts/scrape_opportunities.py "${{ inputs.source_id }}"
          elif [ -n "${{ inputs.remove_source_id }}" ]; then
            echo "Source removed; skipping full scrape."
          else
            python scripts/scrape_opportunities.py
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json data/scrape-meta.json data/custom-sources.json
          if git diff --staged --quiet; then
            echo "No opportunity changes."
          else
            git commit -m "chore: refresh scraped opportunities"
            # Other scrape runs may have pushed meanwhile — rebase then push.
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "Push succeeded."
                exit 0
              fi
              echo "Push race, retry $i..."
              sleep $((i * 2))
            done
            echo "Failed to push after retries."
            exit 1
          fi
