name: Scrape opportunities

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape sources
        run: python scripts/scrape_opportunities.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json data/scrape-meta.json
          if git diff --staged --quiet; then
            echo "No opportunity changes."
          else
            git commit -m "chore: refresh scraped opportunities"
            git push
          fi
