<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Research Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
  </head>
  <body class="page-home">
    <div class="hero-bg" aria-hidden="true"></div>

    <nav class="top-pills" aria-label="Primary">
      <a class="pill" href="daily.html">Daily Report</a>
      <a class="pill" href="library.html">Library</a>
      <a class="pill" href="#" id="pdf-link">PDF</a>
    </nav>

    <div class="count-badge" id="count-badge" aria-live="polite">
      <span class="count-number" id="count-number">—</span>
    </div>

    <div id="auth-root" class="auth-root-home"></div>

    <main class="home-main">
      <form class="hero-search" id="search-form" role="search">
        <label class="sr-only" for="query">Search</label>
        <input
          id="query"
          name="q"
          type="search"
          placeholder="search"
          autocomplete="off"
          autofocus
        />
      </form>

      <div class="search-filters search-filters--hidden" id="search-filters" aria-label="Filters">
        <div class="filter-group">
          <select id="filter-type" class="filter-select" aria-label="Filter by type">
            <option value="">All types</option>
            <option value="jobs">Jobs &amp; Internships</option>
            <option value="programs">Programs &amp; Scholarships</option>
            <option value="awards">Grants &amp; Awards</option>
            <option value="calls">Partnership Calls</option>
            <option value="events">Events &amp; Classes</option>
            <option value="other">Opportunities</option>
          </select>
        </div>
        <div class="filter-group">
          <select id="filter-continent" class="filter-select" aria-label="Filter by region">
            <option value="">Any region</option>
            <option value="africa">Africa</option>
            <option value="asia">Asia</option>
            <option value="europe">Europe</option>
            <option value="americas">Americas</option>
            <option value="middle-east">Middle East</option>
            <option value="oceania">Oceania</option>
          </select>
        </div>
        <div class="filter-group">
          <input
            type="text"
            id="filter-country"
            class="filter-input"
            placeholder="Country…"
            autocomplete="off"
            aria-label="Filter by country"
          />
        </div>
      </div>

      <section class="home-results" id="home-results" hidden>
        <p id="results-meta" class="results-meta"></p>
        <div id="results-list" class="results-cards"></div>
      </section>
    </main>

    <a class="brand-mark" href="index.html">Research<br />Hub</a>

    <div id="music-player-root"></div>
    <script type="module" src="js/home.js"></script>
    <script type="module" src="js/player.js"></script>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
